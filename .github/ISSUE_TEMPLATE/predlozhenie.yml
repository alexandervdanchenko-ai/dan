name: Предложение
description: Новая возможность языка или библиотеки
labels: ["предложение"]
body:
  - type: markdown
    attributes:
      value: |
        Каждое предложение отвечает на четыре вопроса из раздела 10 файла `принципы.md` и объясняет, как рассказать о новой возможности новичку. Как проходит рассмотрение - в разделе «Предложения» файла `УЧАСТИЕ.md`: обсуждение не меньше 10 дней, затем неделя с меткой «скорее принять» или «скорее отклонить», когда ещё можно возразить.

        Если вы не готовы заполнять все поля, напишите «историю задачи»: что хотели сделать и где было неудобно. Это не менее ценно.
  - type: textarea
    id: zadacha
    attributes:
      label: Какую задачу решает
      description: Пример программы, которую сейчас написать неудобно или нельзя
    validations:
      required: true
  - type: textarea
    id: novichku
    attributes:
      label: Как объяснить новичку
      description: Короткое объяснение и пример для учебника «Дан с нуля» - так, как его прочтёт человек, который никогда не программировал. Если объяснить просто не получается, это довод против предложения.
    validations:
      required: true
  - type: textarea
    id: tsena
    attributes:
      label: Чего стоит
      description: Скорость, объём языка, который нужно изучить, сложность компилятора
    validations:
      required: true
  - type: textarea
    id: drugie
    attributes:
      label: Не повторяет ли проблему другого языка
    validations:
      required: true
  - type: textarea
    id: sovmestimost
    attributes:
      label: Не ломает ли написанные программы
    validations:
      required: true
  - type: input
    id: prototip
    attributes:
      label: Прототип
      description: Ветка с работающей реализацией и тестами. Для изменения языка она нужна до начала 10-дневного обсуждения; для функции библиотеки можно добавить позже.
    validations:
      required: false
