# Движок «нейро» на настоящих моделях (необязательный сценарий, не входит в проверку), на Linux x86-64 и ARM:
# скачивает модели GGUF с открытой лицензией (TinyLlama 1.1B Chat - Apache 2.0, Qwen2.5 0.5B
# Instruct - Apache 2.0, в Q8_0 и Q4_K_M; Mistral 7B Instruct v0.2 - Apache 2.0, в Q4_K_M -
# модель главной цели ROADMAP.md: 7B Q4_K_M на 4 ядрах), собирает llama.cpp закреплённой
# версии (modeli.ВЕРСИЯ_LLAMA) и сверяет с ней движок на Дане: токены набора строк, логиты,
# жадный ответ; печатает скорость порождения и чтения запроса движка и llama.cpp при одинаковом
# числе потоков и предел
# «скорость памяти / объём весов» по эталону замеры/память. Таблица - в итоге задания;
# из неё обновляется раздел «Движок на Дане» в замеры/результаты.md.
#
# Задание slabaya - замер на слабой машине (ARM, 4 ядра и 4 ГБ, модели в 2-4 бита): ветки
# dvizhok-zamer-slabaya-... (только оно) и запуск вручную.
#
# Запуск вручную:
#   gh api -X POST repos/<владелец>/dan/actions/workflows/dvizhok.yml/dispatches -f ref=<ветка>
# или отправкой ветки с названием dvizhok-zamer-... (так замеряется ещё не слитое изменение).
name: Движок на настоящих моделях

on:
  push:
    branches: ["dvizhok-zamer*"]
  workflow_dispatch:
    inputs:
      modeli:
        description: "модели через пробел: tinyllama-q8 tinyllama-q4km qwen-q8 qwen-q4km mistral7b-q4km"
        required: false
        default: "tinyllama-q8 tinyllama-q4km qwen-q8 qwen-q4km mistral7b-q4km"
      tokenov:
        description: "токенов жадного ответа"
        required: false
        default: "32"

jobs:
  dvizhok:
    name: Движок против llama.cpp (Linux ${{ matrix.arch }})
    if: ${{ !startsWith(github.ref_name, 'dvizhok-zamer-slabaya') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86-64
          - os: ubuntu-24.04-arm
            arch: ARM
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
      MODELI: ${{ github.event.inputs.modeli || 'tinyllama-q8 tinyllama-q4km qwen-q8 qwen-q4km mistral7b-q4km' }}
      TOKENOV: ${{ github.event.inputs.tokenov || '32' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Машина
        run: |
          echo "ядер: $(nproc), память: $(free -g | awk '/Mem/ {print $2}') ГБ"
          # на ARM в /proc/cpuinfo нет строки «model name»: модель процессора - из lscpu
          cpu="$(lscpu | grep -m1 -i 'model name' | sed 's/.*: *//')"
          echo "процессор: $cpu; $(grep -m1 -o -w 'i8mm' /proc/cpuinfo || echo 'без i8mm')"
          echo "metka=$(python -c 'import modeli; print(modeli.ВЕРСИЯ_LLAMA)')" >> "$GITHUB_ENV"
          # llama.cpp собирается с -DGGML_NATIVE=ON: сборка с другого процессора может не выполниться
          echo "cpu=$(echo "$cpu" | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_ENV"
      - name: Кэш llama.cpp
        id: kesh
        uses: actions/cache@v4
        with:
          path: llama-dvizhok
          key: llama-dvizhok-${{ env.metka }}-${{ runner.os }}-${{ env.cpu }}-${{ hashFiles('.github/workflows/dvizhok.yml') }}
      - name: Сборка llama.cpp
        if: steps.kesh.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$metka" https://github.com/ggml-org/llama.cpp llama-src
          cmake -S llama-src -B llama-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_COMMON=OFF -DLLAMA_CURL=OFF
          cmake --build llama-build --config Release -j "$(nproc)" --target llama
          mkdir -p llama-dvizhok
          cp -a llama-build/bin/*.so* llama-dvizhok/
          ls -la llama-dvizhok
      - name: Модели
        run: |
          mkdir -p modeli
          for m in $MODELI; do
            case $m in
              tinyllama-q8) u=https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q8_0.gguf ;;
              tinyllama-q4km) u=https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf ;;
              qwen-q8) u=https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q8_0.gguf ;;
              qwen-q4km) u=https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf ;;
              mistral7b-q4km) u=https://huggingface.co/TheBloke/Mistral-7B-Instruct-v0.2-GGUF/resolve/main/mistral-7b-instruct-v0.2.Q4_K_M.gguf ;;
              *) echo "неизвестная модель $m"; exit 1 ;;
            esac
            curl -sSfL --retry 3 -o "modeli/$m.gguf" "$u"
            ls -la "modeli/$m.gguf"
          done
      - name: Компилятор из семени
        run: sh semya/sobrat.sh
      - name: Ядра пакета (матрица весов на 256 векторов)
        run: |
          gcc -std=c11 -O3 -ffp-contract=off -w sreda/yadra_test.c -o yadra_test -lm -pthread
          ./yadra_test zamer_paket | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Эталон скорости чтения памяти
        run: |
          semya/dan собрать замеры/память/память.dan
          замеры/память/память 2 1 9 | tee pamyat.txt
          echo "pamyat=$(grep 'скорость чтения' pamyat.txt | grep -o '[0-9.]*' | head -1)" >> "$GITHUB_ENV"
      - name: Сверка и скорость
        env:
          DAN_HOME: ${{ github.workspace }}
        run: |
          python замеры/нейро/сверка.py "$PWD/llama-dvizhok" semya/dan modeli/*.gguf --потоков="$(nproc)" \
            --токенов="$TOKENOV" --память="$pamyat" --итог="$GITHUB_STEP_SUMMARY"

  chernovik:
    # Спекулятивная генерация (м.ответ_с_черновиком): пары моделей Qwen2.5 Instruct с общим словарём
    # (Apache 2.0): 7B Q4_K_M и 1.5B Q4_K_M - большие, 0.5B Q8_0 - черновик. Скорость без черновика и с
    # черновиком при к = 2..8, доля принятых, совпадение текста при жадной выборке; llama.cpp той же версии
    # без черновика и llama-speculative-simple (если соберётся). Таблица - в итоге задания; из неё
    # обновляется раздел «Спекулятивная генерация» в замеры/результаты.md.
    name: Спекулятивная генерация (Linux x86-64)
    if: ${{ !startsWith(github.ref_name, 'dvizhok-zamer-slabaya') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      TOKENOV: "128"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Машина
        run: |
          echo "ядер: $(nproc), память: $(free -g | awk '/Mem/ {print $2}') ГБ"
          grep -m1 "model name" /proc/cpuinfo
          echo "metka=$(python -c 'import modeli; print(modeli.ВЕРСИЯ_LLAMA)')" >> "$GITHUB_ENV"
          echo "cpu=$(grep -m1 'model name' /proc/cpuinfo | sed 's/.*: //' | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_ENV"
      - name: Кэш llama.cpp
        id: kesh
        uses: actions/cache@v4
        with:
          path: llama-chernovik
          key: llama-chernovik-${{ env.metka }}-${{ runner.os }}-${{ env.cpu }}-${{ hashFiles('.github/workflows/dvizhok.yml') }}
      - name: Сборка llama.cpp (библиотека и llama-speculative-simple)
        if: steps.kesh.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$metka" https://github.com/ggml-org/llama.cpp llama-src
          cmake -S llama-src -B llama-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_COMMON=ON -DLLAMA_CURL=OFF
          cmake --build llama-build --config Release -j "$(nproc)" --target llama
          mkdir -p llama-chernovik
          cp -a llama-build/bin/*.so* llama-chernovik/
          # пример спекулятивной генерации llama.cpp: если не соберётся, замер идёт без него
          cmake --build llama-build --config Release -j "$(nproc)" --target llama-speculative-simple \
            && cp -a llama-build/bin/llama-speculative-simple llama-chernovik/ \
            && cp -a llama-build/bin/*.so* llama-chernovik/ || echo "llama-speculative-simple не собран"
          ls -la llama-chernovik
      - name: Модели
        run: |
          mkdir -p modeli
          curl -sSfL --retry 3 -o modeli/qwen7b-q4km.gguf https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf
          curl -sSfL --retry 3 -o modeli/qwen1.5b-q4km.gguf https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          curl -sSfL --retry 3 -o modeli/qwen0.5b-q8.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q8_0.gguf
          ls -la modeli
      - name: Компилятор из семени
        run: sh semya/sobrat.sh
      - name: Замер
        env:
          DAN_HOME: ${{ github.workspace }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/llama-chernovik
        run: |
          for bolshaya in modeli/qwen7b-q4km.gguf modeli/qwen1.5b-q4km.gguf; do
            python замеры/нейро/черновик.py semya/dan "$bolshaya" modeli/qwen0.5b-q8.gguf --потоков="$(nproc)" \
              --токенов="$TOKENOV" --к=1,2,3,4,6,8 --llama="$PWD/llama-chernovik" \
              --llama-черновик="$PWD/llama-chernovik/llama-speculative-simple" --итог="$GITHUB_STEP_SUMMARY"
          done

  slabaya:
    # Слабая машина (ROADMAP.md, главная цель): ARM, задача ограничена 4 ядрами и 4 ГБ памяти без подкачки
    # (systemd-run --scope: MemoryMax=4G, MemorySwapMax=0, AllowedCPUs, и taskset). Mistral 7B Instruct v0.2
    # (Apache 2.0) в Q2_K и Q3_K_M - влезает ли в 4 ГБ вместе с кэшем; Qwen2.5 1.5B Instruct (Apache 2.0) в
    # Q4_K_M, Q3_K_M и IQ4_XS. Qwen2.5 3B не берётся: её лицензия Qwen Research не открытая. Движок на Дане
    # против llama.cpp той же версии в тех же пределах: скорость порождения и чтения запроса, пиковая память
    # группы, доля предела, совпадение жадного ответа. Таблица - в итоге задания; из неё обновляется раздел
    # «Поток 24В» в замеры/результаты.md.
    name: Слабая машина - 4 ядра и 4 ГБ (Linux ARM)
    # только для веток dvizhok-zamer-slabaya* и запуска вручную: замер долгий
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'dvizhok-zamer-slabaya')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      TOKENOV: "32"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Машина
        run: |
          echo "ядер: $(nproc), память: $(free -g | awk '/Mem/ {print $2}') ГБ, подкачка: $(free -g | awk '/Swap/ {print $2}') ГБ"
          cpu="$(lscpu | grep -m1 -i 'model name' | sed 's/.*: *//')"
          echo "процессор: $cpu; cgroup: $(stat -fc %T /sys/fs/cgroup); $(systemctl --version | head -1)"
          echo "metka=$(python -c 'import modeli; print(modeli.ВЕРСИЯ_LLAMA)')" >> "$GITHUB_ENV"
          echo "cpu=$(echo "$cpu" | tr -c 'A-Za-z0-9' '-')" >> "$GITHUB_ENV"
      - name: Кэш llama.cpp
        id: kesh
        uses: actions/cache@v4
        with:
          path: llama-slabaya
          key: llama-slabaya-${{ env.metka }}-${{ runner.os }}-${{ env.cpu }}-${{ hashFiles('.github/workflows/dvizhok.yml') }}
      - name: Сборка llama.cpp
        if: steps.kesh.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$metka" https://github.com/ggml-org/llama.cpp llama-src
          cmake -S llama-src -B llama-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_COMMON=OFF -DLLAMA_CURL=OFF
          cmake --build llama-build --config Release -j "$(nproc)" --target llama
          mkdir -p llama-slabaya
          cp -a llama-build/bin/*.so* llama-slabaya/
      - name: Модели
        run: |
          mkdir -p modeli
          m=https://huggingface.co/TheBloke/Mistral-7B-Instruct-v0.2-GGUF/resolve/main/mistral-7b-instruct-v0.2
          q=https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct
          curl -sSfL --retry 3 -o modeli/mistral7b-q2k.gguf "$m.Q2_K.gguf"
          curl -sSfL --retry 3 -o modeli/mistral7b-q3km.gguf "$m.Q3_K_M.gguf"
          curl -sSfL --retry 3 -o modeli/qwen1.5b-q4km.gguf \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          curl -sSfL --retry 3 -o modeli/qwen1.5b-q3km.gguf "$q-Q3_K_M.gguf" || echo "нет Q3_K_M"
          curl -sSfL --retry 3 -o modeli/qwen1.5b-iq4xs.gguf "$q-IQ4_XS.gguf" || echo "нет IQ4_XS"
          ls -la modeli
      - name: Компилятор из семени
        run: sh semya/sobrat.sh
      - name: Ядра Q2_K, Q3_K, IQ4_XS (матрица весов на вектор и на 256 векторов)
        run: |
          gcc -std=c11 -O3 -ffp-contract=off -w sreda/yadra_test.c -o yadra_test -lm -pthread
          ./yadra_test | tail -1
          DAN_POTOKI=4 ./yadra_test zamer_paket | grep -E "потоков|Q2_K|Q3_K|IQ4_XS|Q4_K" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Замер в пределах 4 ядер и 4 ГБ
        env:
          DAN_HOME: ${{ github.workspace }}
        run: |
          python замеры/нейро/слабая_машина.py "$PWD/llama-slabaya" semya/dan modeli/*.gguf --ядер=4 --память=4G \
            --токенов="$TOKENOV" --итог="$GITHUB_STEP_SUMMARY"
