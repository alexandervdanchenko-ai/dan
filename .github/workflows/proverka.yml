# Проверка Дана при каждом изменении: все тесты в Windows, Linux и macOS,
# на процессорах x86-64 и ARM.
name: Проверка

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    name: Тесты (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      DAN_GUI_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Программы для проверки документов (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils fonts-dejavu-core libcurl4 libsqlite3-0 clang
          sudo apt-get install -y libclang-rt-dev || sudo apt-get install -y libclang-rt-18-dev
          python -m pip install pypdf reportlab openpyxl python-docx markdown
      - name: Программы для проверки документов (macOS, Windows)
        if: runner.os != 'Linux'
        run: python -m pip install pypdf reportlab openpyxl python-docx markdown
      - name: Компилятор C
        shell: bash
        run: |
          (command -v gcc || command -v clang || command -v cc) && (gcc --version || clang --version) | head -1
      - name: Созданные файлы не устарели
        shell: bash
        run: python пересоздать.py --проверить
      - name: Тесты
        # классы тестов идут параллельно на всех ядрах машины (testy.py)
        shell: bash
        run: python testy.py > вывод_тестов.txt 2>&1
      - name: Время тестов
        if: always()
        shell: bash
        run: tail -n 200 вывод_тестов.txt
      - name: Упавшие тесты
        if: failure()
        shell: bash
        run: python .github/otchet.py вывод_тестов.txt

  semya:
    name: Компилятор из семени (${{ matrix.os }})
    # Python здесь не запускается: компилятор собирается из semya/dan.c компилятором C,
    # затем собирает сам себя и сверяет код C с семенем
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Сборка из семени (Linux, macOS)
        if: runner.os != 'Windows'
        run: time sh semya/sobrat.sh
      - name: Сборка из семени (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: semya\sobrat.cmd
      - name: Семя не устарело
        shell: bash
        run: semya/dan запустить semya/obnovit.dan --проверить
      - name: Компилятор собирает сам себя, код C совпадает с семенем
        shell: bash
        run: |
          semya/dan собрать сам/дан.dan
          semya/dan запустить semya/obnovit.dan --проверить сам/дан

  fazzing:
    name: Фаззинг разборщиков
    # образ закреплён: libFuzzer и санитайзеры зависят от пакетов clang конкретной версии Ubuntu;
    # переход ubuntu-latest на новую версию проверяют тесты (ubuntu-latest в матрице выше)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: clang с libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang fonts-dejavu-core
          sudo apt-get install -y libclang-rt-dev || sudo apt-get install -y libclang-rt-18-dev
      - name: Фаззинг (по 45 секунд на каждую мишень)
        run: python fazzing.py --секунд=45
      - name: Сверка сборок (gcc и clang, -O0, -O2, -Os)
        run: |
          sudo apt-get install -y gcc
          python sverka_sborok.py 150 ${{ github.run_number }}
      - name: Находки сверки сборок
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nahodki-sborok
          path: фаззинг/находки_сборок
          if-no-files-found: ignore

  ustanovka:
    name: Установка в Windows по инструкции
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Установка (Windows PowerShell, как в README)
        # в шагах PowerShell 5.1 только латиница: служебный файл шага он читает без учёта UTF-8
        shell: powershell
        env:
          DAN_FOLDER: ${{ runner.temp }}\проекты\Дан
          DAN_NO_TESTS: "1"
        run: |
          $script = (Get-ChildItem -Filter "*_windows.ps1" | Select-Object -First 1).FullName
          powershell -ExecutionPolicy Bypass -File $script *> install.txt
          $code = $LASTEXITCODE
          Get-Content install.txt
          exit $code
      - name: Вывод установки
        if: failure()
        shell: powershell
        run: |
          $t = (Get-Content install.txt -Raw)
          if ($t.Length -gt 6000) { $t = $t.Substring($t.Length - 6000) }
          $t = $t.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
          Write-Output "::error title=Install failed::$t"
      - name: Сборка программы с русским именем в установленной папке
        shell: python
        env:
          DAN_FOLDER: ${{ runner.temp }}\проекты\Дан
          PYTHONUTF8: "1"
        run: |
          import os, subprocess, sys
          папка = os.environ["DAN_FOLDER"]
          subprocess.run([sys.executable, "dan.py", "собрать", os.path.join("примеры", "факториал.dan")],
                         cwd=папка, check=True)
          subprocess.run([os.path.join(папка, "примеры", "факториал.exe")], cwd=папка, check=True)

  postavka:
    name: Поставка для Windows (установщик без Python)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Сборка поставки
        run: python поставка/собрать.py
      - name: Установка без окон и проверка установленного Дана
        shell: python
        run: |
          import glob, os, subprocess, sys, winreg
          setup = glob.glob(os.path.join("поставка", "готово", "*-setup.exe"))[0]
          папка = os.path.join(os.environ["LOCALAPPDATA"], "Programs", "Dan")
          subprocess.run([setup, "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/TASKS=path,assoc",
                          "/LOG=установка.log"], check=True)
          dan = os.path.join(папка, "dan.exe")
          assert os.path.isfile(dan), "dan.exe не установлен в " + папка
          with winreg.OpenKey(winreg.HKEY_CURRENT_USER, "Environment") as к:
              путь = winreg.QueryValueEx(к, "Path")[0]
          assert папка.lower() in путь.lower(), "папка Дана не добавлена в PATH: " + путь
          р = subprocess.run([sys.executable, os.path.join("поставка", "проверить.py"), dan],
                             capture_output=True, text=True, encoding="utf-8", errors="replace")
          print(р.stdout, р.stderr)
          if р.returncode:
              текст = (р.stdout + р.stderr)[-8000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error title=Проверка поставки::" + текст)
          sys.exit(р.returncode)
