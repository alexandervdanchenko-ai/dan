# Проверка Дана при каждом изменении: все тесты в Windows, Linux и macOS,
# на процессорах x86-64 и ARM.
name: Проверка

# Ветки проверяются один раз - через запрос на слияние; на отправку проверка идёт только в main.
# Новая отправка в тот же запрос отменяет его прежнюю, устаревшую проверку (в main не отменяется).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testy:
    name: Тесты (${{ matrix.os }}${{ matrix.chast && format(', часть {0}', matrix.chast) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # в Windows сборки компилятором C в несколько раз дольше: тесты делятся на две машины
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: windows-latest
            chast: 1/2
          - os: windows-latest
            chast: 2/2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      DAN_GUI_NO_BROWSER: "1"
      DAN_CHAST: ${{ matrix.chast }}
    steps:
      - uses: actions/checkout@v5
      - name: Папка кэша Дана
        # кэш собранных программ и готовой среды переносится между прогонами (actions/cache ниже);
        # отпечаток в кэше учитывает весь код C, ключи, компилятор и версию Дана
        shell: bash
        run: echo "DAN_CACHE=$RUNNER_TEMP/dan-kesh" >> "$GITHUB_ENV"
      - name: Кэш собранных программ и готовой среды
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/dan-kesh
          key: dan-kesh-${{ matrix.os }}-${{ strategy.job-index }}-${{ github.sha }}
          restore-keys: dan-kesh-${{ matrix.os }}-${{ strategy.job-index }}-
      - name: Защитник Windows не проверяет сборки
        # проверка каждого нового .exe и .o заметно замедляет сотни сборок тестов
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}", $env:TEMP, $env:RUNNER_TEMP
          Add-MpPreference -ExclusionProcess "gcc.exe", "cc1.exe", "as.exe", "ld.exe", "collect2.exe"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Программы для проверки документов (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils fonts-dejavu-core libcurl4 libsqlite3-0 clang
          sudo apt-get install -y libclang-rt-dev || sudo apt-get install -y libclang-rt-18-dev
          python -m pip install pypdf reportlab openpyxl python-docx markdown
      - name: Программы для проверки документов (macOS, Windows)
        if: runner.os != 'Linux'
        run: python -m pip install pypdf reportlab openpyxl python-docx markdown
      - name: Компилятор C
        shell: bash
        run: |
          (command -v gcc || command -v clang || command -v cc) && (gcc --version || clang --version) | head -1
      - name: Созданные файлы не устарели
        shell: bash
        run: python пересоздать.py --проверить
      - name: Тесты
        # классы тестов идут параллельно на всех ядрах машины (testy.py)
        shell: bash
        run: python testy.py ${DAN_CHAST:+--часть=$DAN_CHAST} > вывод_тестов.txt 2>&1
      - name: Время тестов
        if: always()
        shell: bash
        run: |
          tail -n 200 вывод_тестов.txt
          python .github/vremya.py вывод_тестов.txt
      - name: Упавшие тесты
        if: failure()
        shell: bash
        run: python .github/otchet.py вывод_тестов.txt

  semya:
    name: Компилятор из семени (${{ matrix.os }})
    # Python здесь не запускается: компилятор собирается из semya/dan.c компилятором C,
    # затем собирает сам себя и сверяет код C с семенем
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Сборка из семени (Linux, macOS)
        if: runner.os != 'Windows'
        run: time sh semya/sobrat.sh
      - name: Сборка из семени (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: semya\sobrat.cmd
      - name: Семя не устарело
        shell: bash
        run: semya/dan запустить semya/obnovit.dan --проверить
      - name: Компилятор собирает сам себя, код C совпадает с семенем
        shell: bash
        run: |
          nachalo=$(date +%s)
          semya/dan собрать сам/дан.dan
          sekund=$(( $(date +%s) - nachalo ))
          # время самосборки записывается в сводку прогона; больше 3 минут - предупреждение, что сборка
          # компилятора перестаёт быть быстрой (заранее, пока это не стало узким местом)
          echo "Самосборка компилятора (${{ matrix.os }}): $sekund с" >> "$GITHUB_STEP_SUMMARY"
          echo "Самосборка компилятора: $sekund с"
          if [ "$sekund" -gt 180 ]; then
            echo "::warning title=Самосборка дольше 3 минут::компилятор собирает сам себя $sekund с (${{ matrix.os }})"
          fi
          semya/dan запустить semya/obnovit.dan --проверить сам/дан

  testy-sam:
    # тот же набор тестов, но программы переводит компилятор на Дане (sam_kompilyator.py): после
    # заморозки компилятора на Python новые возможности языка есть только в нём
    name: Тесты на компиляторе на Дане (Linux)
    needs: llama
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      DAN_GUI_NO_BROWSER: "1"
      DAN_KOMPILYATOR: сам
      # компилятор на Дане для тестов переводит компилятор из семени, а не компилятор на Python
      DAN_SAM_IZ_SEMENI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Программы для проверки документов
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf poppler-utils fonts-dejavu-core libcurl4 libsqlite3-0 clang
          sudo apt-get install -y libclang-rt-dev || sudo apt-get install -y libclang-rt-18-dev
          python -m pip install pypdf reportlab openpyxl python-docx markdown
      - uses: actions/download-artifact@v8
        with:
          name: llama-linux-x64
          path: ${{ runner.temp }}/llama-arhiv
      - uses: actions/download-artifact@v8
        with:
          name: llama-simple-linux-x64
          path: ${{ runner.temp }}/llama-arhiv
      - name: Библиотека llama.cpp для тестов
        # та же библиотека, что в выпуске (задание «Библиотека llama.cpp»); рядом - пример llama-simple,
        # с которым test_modeli сверяет ответ Дана
        run: |
          mkdir -p "$RUNNER_TEMP/llama"
          unzip -q "$RUNNER_TEMP"/llama-arhiv/llama-*-linux-x64.zip -d "$RUNNER_TEMP/llama"
          cp "$RUNNER_TEMP"/llama-arhiv/llama-simple-*-linux-x64 "$RUNNER_TEMP/llama/llama-simple"
          chmod +x "$RUNNER_TEMP/llama/llama-simple"
          ls -la "$RUNNER_TEMP/llama"
          echo "DAN_LLAMA=$RUNNER_TEMP/llama" >> "$GITHUB_ENV"
      - name: Сборка компилятора на Дане
        run: python -c "import sam_kompilyator; print(sam_kompilyator.исполняемый())"
      - name: Тесты
        run: python testy.py > вывод_тестов.txt 2>&1
      - name: Время тестов
        if: always()
        run: tail -n 200 вывод_тестов.txt
      - name: Упавшие тесты
        if: failure()
        run: python .github/otchet.py вывод_тестов.txt

  fazzing:
    name: Фаззинг разборщиков (${{ matrix.mesto }})
    # образ закреплён: libFuzzer и санитайзеры зависят от пакетов clang конкретной версии Ubuntu;
    # переход ubuntu-latest на новую версию проверяют тесты (ubuntu-latest в матрице выше)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # мишени делятся на три машины: разборщики получают по 45 секунд, компилятор на Дане - 5 минут
        include:
          - mesto: тексты
            misheni: json csv xml base64 почта
            sekund: 45
          - mesto: документы и архивы
            misheni: word excel pdf архив распаковка расшифровка
            sekund: 45
          # компилятор на Дане: лексер, разбор, модули, проверка и порождение на текстах программ
          - mesto: компилятор
            misheni: компилятор
            sekund: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: clang с libFuzzer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang fonts-dejavu-core
          sudo apt-get install -y libclang-rt-dev || sudo apt-get install -y libclang-rt-18-dev
      - name: Фаззинг
        run: python fazzing.py ${{ matrix.misheni }} --секунд=${{ matrix.sekund }}

  sverka:
    name: Сверка сборок
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: gcc и clang
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang fonts-dejavu-core
      - name: Сверка сборок (gcc и clang, -O0, -O2, -O3, -Os)
        # программы переводит компилятор на Дане: порождение кода меняется только в нём
        env:
          DAN_KOMPILYATOR: сам
        run: python sverka_sborok.py 150 ${{ github.run_number }}
      - name: Находки сверки сборок
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nahodki-sborok
          path: фаззинг/находки_сборок
          if-no-files-found: ignore


  parallelno:
    name: Фаззинг параллельного цикла
    # случайные программы с «параллельно для»: вывод не зависит от числа потоков и совпадает с обычным
    # «для», ThreadSanitizer не видит гонок, испорченные варианты отвергаются с кодом Д03xx
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: clang для ThreadSanitizer
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Программы (каждый прогон - новые зёрна)
        run: python fazzing_parallelno.py 150 --зерно=$(( (GITHUB_RUN_ID % 100000) * 1000 ))
      - name: Программы под ThreadSanitizer
        run: python fazzing_parallelno.py 15 --зерно=$(( (GITHUB_RUN_ID % 100000) * 1000 + 500 )) --tsan
      - name: Находки
        if: failure()
        run: for ф in фаззинг/находки_параллельно/*.dan; do echo "== $ф"; cat "$ф"; done

  sanitayzery:
    name: Компилятор под санитайзерами
    # компилятор из семени с ASan, LSan и UBSan переводит сам себя (код C совпадает с семенем) и все
    # программы каталога, примеров, совместимости, показательных и задач; вывод сверяется с обычной сборкой
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Компилятор под санитайзерами
        run: python sanitayzery_kompilyatora.py

  vyklyuchateli:
    name: Выключатели оптимизаций
    # программы каталога, показательные и задачи со всеми выключателями оптимизаций Дана и обычными
    # ядрами C дают тот же вывод, что записан в каталоге: ошибку оптимизации локализует один выключатель
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      DAN_KOMPILYATOR: сам
      DAN_BEZ_PERENOSA: "1"
      DAN_BEZ_DIAPAZONOV: "1"
      DAN_YADRA: c
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Каталог со всеми выключателями
        run: python testy.py test_katalog test_sam.ТестыРезультатаПрограмм test_pokazatelnye test_zadachi test_massivy test_parallelno
  ustanovka:
    name: Установка в Windows по инструкции
    needs: llama
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: llama-windows-x64
          path: llama-vypusk
      - name: Установка (Windows PowerShell, как в README)
        # в шагах PowerShell 5.1 только латиница: служебный файл шага он читает без учёта UTF-8
        shell: powershell
        env:
          DAN_FOLDER: ${{ runner.temp }}\проекты\Дан
          DAN_NO_TESTS: "1"
        run: |
          $script = (Get-ChildItem -Filter "*_windows.ps1" | Select-Object -First 1).FullName
          powershell -ExecutionPolicy Bypass -File $script *> install.txt
          $code = $LASTEXITCODE
          Get-Content install.txt
          exit $code
      - name: Вывод установки
        if: failure()
        shell: powershell
        run: |
          $t = (Get-Content install.txt -Raw)
          if ($t.Length -gt 6000) { $t = $t.Substring($t.Length - 6000) }
          $t = $t.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
          Write-Output "::error title=Install failed::$t"
      - name: Сборка программы с русским именем в установленной папке
        shell: python
        env:
          DAN_FOLDER: ${{ runner.temp }}\проекты\Дан
          PYTHONUTF8: "1"
        run: |
          import os, subprocess, sys
          папка = os.environ["DAN_FOLDER"]
          subprocess.run([sys.executable, "dan.py", "собрать", os.path.join("примеры", "факториал.dan")],
                         cwd=папка, check=True)
          subprocess.run([os.path.join(папка, "примеры", "факториал.exe")], cwd=папка, check=True)
      - name: Библиотека llama.cpp этой версии
        # сценарий установки берёт её из выпуска; у ещё не выпущенной версии выпуска нет, поэтому
        # кладётся та же библиотека из задания «Библиотека llama.cpp» в папку данных пользователя
        shell: python
        run: |
          import glob, os, shutil, zipfile
          папка = os.path.join(os.environ["LOCALAPPDATA"], "Dan", "llama")
          shutil.rmtree(папка, ignore_errors=True)
          with zipfile.ZipFile(glob.glob(os.path.join("llama-vypusk", "llama-*-windows-x64.zip"))[0]) as з:
              з.extractall(папка)
          print(sorted(os.listdir(папка)))
      - name: Установленный Дан собирает программы новых версий и программы каталога
        # компилятор на Дане из семени (semya\dan.exe) в папке, куда сценарий установки загрузил проект
        # (ветка main) и где он собрал этот компилятор; проверка - из этого запроса: плотные
        # массивы, векторные ядра, «параллельно для», модуль «модели» на крошечной модели GGUF,
        # «dan модели проверить», все программы и сообщения об ошибках каталога
        shell: python
        env:
          DAN_FOLDER: ${{ runner.temp }}\проекты\Дан
          DAN_HOME: ${{ runner.temp }}\проекты\Дан
          PYTHONUTF8: "1"
        run: |
          import os, subprocess, sys
          папка = os.environ["DAN_FOLDER"]
          р = subprocess.run([sys.executable, os.path.join("поставка", "проверить.py"),
                              os.path.join(папка, "semya", "dan.exe"), "--без-поставки"],
                             capture_output=True, text=True, encoding="utf-8", errors="replace")
          print(р.stdout, р.stderr)
          if р.returncode:
              текст = (р.stdout + р.stderr)[-8000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error title=Проверка установки::" + текст)
          sys.exit(р.returncode)

  llama:
    # библиотека llama.cpp для модуля «модели» на четырёх системах (из кэша, если версия не менялась)
    name: Библиотека llama.cpp
    uses: ./.github/workflows/llama.yml

  llama-proverka:
    # «dan модели установить» ставит библиотеку из архива так же, как из выпуска (адрес выпуска
    # заменяет DAN_VYPUSKI), «dan модели проверить» находит её, загружает и выбирает вариант для процессора
    name: Модели - установка и проверка llama.cpp (${{ matrix.platforma }})
    needs: llama
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platforma: linux-x64
          - os: ubuntu-24.04-arm
            platforma: linux-arm64
          - os: macos-latest
            platforma: macos-arm64
          - os: windows-latest
            platforma: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: llama-${{ matrix.platforma }}
          path: llama-vypusk
      - name: Контрольные суммы, как в выпуске
        shell: bash
        run: |
          cd llama-vypusk
          (sha256sum *.zip || shasum -a 256 *.zip) > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Сборка из семени (Linux, macOS)
        if: runner.os != 'Windows'
        run: sh semya/sobrat.sh
      - name: Сборка из семени (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: semya\sobrat.cmd
      - name: dan модели установить, dan модели проверить
        shell: bash
        run: |
          papka="$PWD/llama-vypusk"
          if [ "$RUNNER_OS" = "Windows" ]; then papka="$(cygpath -m "$papka")"; fi
          export DAN_VYPUSKI="file:///${papka#/}"
          semya/dan модели проверить && { echo "библиотека найдена до установки"; exit 1; } || true
          semya/dan модели установить
          semya/dan модели проверить | tee proverka.txt
          grep -q "Вариант для процессора: .*ggml-cpu-" proverka.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat proverka.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  postavka:
    name: Поставка для Windows (установщик без Python)
    needs: llama
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: llama-windows-x64
          path: llama-vypusk
      - name: Сборка поставки
        # DLL библиотеки llama.cpp из задания «Библиотека llama.cpp» кладутся рядом с dan.exe
        shell: bash
        run: python поставка/собрать.py --llama="$(ls llama-vypusk/llama-*-windows-x64.zip)"
      - name: Установка без окон и проверка установленного Дана
        # проверить.py: программы каталога, программы с возможностями 1.5 и новее (поставка/программы),
        # модель GGUF и «dan модели проверить» - установленным dan.exe без Python и компилятора C в PATH
        shell: python
        run: |
          import glob, os, subprocess, sys, winreg
          setup = glob.glob(os.path.join("поставка", "готово", "*-setup.exe"))[0]
          папка = os.path.join(os.environ["LOCALAPPDATA"], "Programs", "Dan")
          subprocess.run([setup, "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/TASKS=path,assoc",
                          "/LOG=установка.log"], check=True)
          dan = os.path.join(папка, "dan.exe")
          assert os.path.isfile(dan), "dan.exe не установлен в " + папка
          with winreg.OpenKey(winreg.HKEY_CURRENT_USER, "Environment") as к:
              путь = winreg.QueryValueEx(к, "Path")[0]
          assert папка.lower() in путь.lower(), "папка Дана не добавлена в PATH: " + путь
          р = subprocess.run([sys.executable, os.path.join("поставка", "проверить.py"), dan],
                             capture_output=True, text=True, encoding="utf-8", errors="replace")
          print(р.stdout, р.stderr)
          if р.returncode:
              текст = (р.stdout + р.stderr)[-8000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error title=Проверка поставки::" + текст)
          sys.exit(р.returncode)
