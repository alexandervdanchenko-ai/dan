# Выпуск версии. Запускается кнопкой «Run workflow» на странице Actions -> «Выпуск»
# (или отправкой метки вида v1.1). Номер версии берётся из versiya.py, описание -
# из файла «выпуски/v<номер>.md»; создаются метка версии и страница выпуска
# с файлами для скачивания.
name: Выпуск

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  vypusk:
    name: Страница выпуска
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Создать выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          номер=$(python3 -c "import versiya; print(versiya.ВЕРСИЯ)")
          метка="v$номер"
          if [ ! -f "выпуски/$метка.md" ]; then
            echo "::error title=Нет описания выпуска::нужен файл выпуски/$метка.md"
            exit 1
          fi
          if gh release view "$метка" > /dev/null 2>&1; then
            echo "::notice title=Выпуск уже есть::$метка уже опубликован"
            exit 0
          fi
          файлы=("установить_windows.ps1")
          for ф in редактор/*.vsix; do [ -f "$ф" ] && файлы+=("$ф"); done
          gh release create "$метка" "${файлы[@]}" --target "$GITHUB_SHA" --title "Дан $номер" \
            --notes-file "выпуски/$метка.md" --latest
