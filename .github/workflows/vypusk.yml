# Выпуск версии. Запускается кнопкой «Run workflow» на странице Actions -> «Выпуск»
# (или отправкой метки вида v1.1). Номер версии берётся из versiya.py, описание -
# из файла «выпуски/v<номер>.md»; создаются метка версии и страница выпуска
# с файлами для скачивания.
name: Выпуск

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  vypusk:
    name: Страница выпуска
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Создать выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        # имена переменных оболочки - только латиницей: bash не принимает другие буквы.
        # GitHub убирает из имён прикреплённых файлов русские буквы, поэтому файл
        # установки прикрепляется под латинским именем install_windows.ps1.
        # Если выпуск уже есть, его описание и файлы обновляются.
        run: |
          version=$(python3 -c "import versiya; print(versiya.ВЕРСИЯ)")
          tag="v$version"
          notes="выпуски/$tag.md"
          if [ ! -f "$notes" ]; then
            echo "::error title=Нет описания выпуска::нужен файл $notes"
            exit 1
          fi
          dir=$(mktemp -d)
          cp установить_windows.ps1 "$dir/install_windows.ps1"
          files=("$dir/install_windows.ps1")
          for f in редактор/*.vsix; do [ -f "$f" ] && files+=("$f"); done
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "Дан $version" --notes-file "$notes"
            for old in $(gh release view "$tag" --json assets -q '.assets[].name'); do
              case "$old" in install_windows.ps1|*.vsix) ;; *) gh release delete-asset "$tag" "$old" -y ;; esac
            done
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "Дан $version" \
              --notes-file "$notes" --latest
          fi
