# Выпуск версии. Запускается кнопкой «Run workflow» на странице Actions -> «Выпуск»
# (или отправкой метки вида v1.2). Номер версии берётся из versiya.py, описание -
# из файла «выпуски/v<номер>.md». Собираются установщик и переносной архив для
# Windows и архивы библиотеки llama.cpp для модуля «модели» (llama-<метка>-<система>.zip,
# их скачивает «dan модели установить»); создаются метка версии и страница выпуска с файлами
# для скачивания.
# Если выпуск уже есть, его описание и файлы обновляются.
# После создания страницы выпуска задание «Проверка выпуска» (proverka_vypuska.yml) скачивает
# его файлы на чистых Linux x86-64 и ARM и macOS и ставит Дан ровно по README.
name: Выпуск

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # привязка файлов выпуска к коммиту и этому сценарию (attestations GitHub, решение 0014):
  # проверка - gh attestation verify <файл> --repo alexandervdanchenko-ai/dan
  id-token: write
  attestations: write

jobs:
  llama:
    name: Библиотека llama.cpp
    uses: ./.github/workflows/llama.yml

  vypusk:
    name: Страница выпуска
    needs: llama
    runs-on: windows-latest
    # окружение «выпуск»: задание ждёт одобрения владельца, только ему доступен ключ подписи
    # (секрет DAN_KLYUCH_PODPISI - закрытый ключ Ed25519 шестнадцатеричными цифрами, решение 0014)
    environment: выпуск
    timeout-minutes: 60
    outputs:
      metka: ${{ steps.vypusk.outputs.metka }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: llama-*
          path: llama-vypusk
          merge-multiple: true
      - name: Сборка поставки
        shell: bash
        run: python поставка/собрать.py --llama="$(ls llama-vypusk/llama-*-windows-x64.zip)"
      - name: Подпись файла сумм
        run: python -m pip install --quiet cryptography
      - name: Создать или обновить выпуск
        id: vypusk
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          DAN_KLYUCH_PODPISI: ${{ secrets.DAN_KLYUCH_PODPISI }}
        run: |
          import glob, os, shutil, subprocess, sys, tempfile
          sys.path.insert(0, os.getcwd())   # сценарий выполняется из временной папки, versiya.py - в корне проекта
          import versiya
          import modeli
          версия = versiya.ВЕРСИЯ
          метка = "v" + версия
          описание = os.path.join("выпуски", метка + ".md")
          if not os.path.isfile(описание):
              print(f"::error title=Нет описания выпуска::нужен файл {описание}")
              raise SystemExit(1)
          # GitHub убирает из имён прикреплённых файлов русские буквы: имена латиницей
          папка = tempfile.mkdtemp()
          shutil.copy("установить_windows.ps1", os.path.join(папка, "install_windows.ps1"))
          файлы = [os.path.join(папка, "install_windows.ps1")]
          файлы += glob.glob(os.path.join("поставка", "готово", "dan-*-setup.exe"))
          файлы += glob.glob(os.path.join("поставка", "готово", "dan-*-windows.zip"))
          файлы += glob.glob(os.path.join("редактор", "*.vsix"))
          # библиотека llama.cpp для четырёх систем: её берут «dan модели установить» и установщик
          llama = sorted(glob.glob(os.path.join("llama-vypusk", f"llama-{modeli.ВЕРСИЯ_LLAMA}-*.zip")))
          if len(llama) != 4:
              print(f"::error title=Нет архивов llama.cpp::нужны 4 архива llama-{modeli.ВЕРСИЯ_LLAMA}-*.zip, есть: {llama}")
              raise SystemExit(1)
          файлы += llama
          # контрольные суммы: файл SHA256SUMS.txt и таблица в описании выпуска
          import hashlib
          суммы = []
          for ф in файлы:
              with open(ф, "rb") as фф:
                  суммы.append((os.path.basename(ф), hashlib.sha256(фф.read()).hexdigest()))
          путь_сумм = os.path.join(папка, "SHA256SUMS.txt")
          with open(путь_сумм, "w", encoding="utf-8", newline="\n") as фф:
              фф.writelines(f"{с}  {и}\n" for и, с in суммы)
          файлы.append(путь_сумм)
          # подпись SHA256SUMS.txt: её проверяет «dan обновить» открытым ключом из компилятора
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          ключ = os.environ.get("DAN_KLYUCH_PODPISI", "").strip()
          if not ключ:
              print("::error title=Нет ключа подписи::секрет DAN_KLYUCH_PODPISI окружения «выпуск» не задан")
              raise SystemExit(1)
          закрытый = Ed25519PrivateKey.from_private_bytes(bytes.fromhex(ключ))
          with open(путь_сумм, "rb") as фф:
              подпись = закрытый.sign(фф.read())
          import re
          with open(os.path.join("сам", "обновление.dan"), encoding="utf-8") as фф:
              записанный = re.findall(r'вернуть "([0-9a-f]{64})"', фф.read())
          if закрытый.public_key().public_bytes_raw().hex() not in записанный:
              print("::error title=Чужой ключ подписи::открытый ключ секрета не совпадает с ключом в сам/обновление.dan")
              raise SystemExit(1)
          with open(путь_сумм + ".sig", "w", encoding="utf-8", newline="\n") as фф:
              фф.write(подпись.hex() + "\n")
          файлы.append(путь_сумм + ".sig")
          with open(описание, encoding="utf-8") as фф:
              текст = фф.read().rstrip() + "\n\n## Контрольные суммы SHA256\n\n| Файл | SHA256 |\n|---|---|\n"
          текст += "".join(f"| `{и}` | `{с}` |\n" for и, с in суммы)
          описание = os.path.join(папка, "описание.md")
          with open(описание, "w", encoding="utf-8") as фф:
              фф.write(текст)
          def gh(*а, проверять=True):
              return subprocess.run(["gh", *а], check=проверять, capture_output=True, text=True,
                                    encoding="utf-8", errors="replace")
          if gh("release", "view", метка, проверять=False).returncode == 0:
              gh("release", "edit", метка, "--title", "Дан " + версия, "--notes-file", описание)
              нужные = {os.path.basename(ф) for ф in файлы}
              for имя in gh("release", "view", метка, "--json", "assets", "-q", ".assets[].name").stdout.split():
                  if имя not in нужные:
                      gh("release", "delete-asset", метка, имя, "-y")
              gh("release", "upload", метка, *файлы, "--clobber")
          else:
              # номер с буквой (1.4b1, 1.4rc1) - пробный выпуск: его получает канал «пробный» команды dan обновить
              import re
              вид = ["--prerelease"] if re.search(r"[a-z]", версия) else ["--latest"]
              gh("release", "create", метка, *файлы, "--target", os.environ["GITHUB_SHA"],
                 "--title", "Дан " + версия, "--notes-file", описание, *вид)
          print("выпуск", метка, "готов:", ", ".join(os.path.basename(ф) for ф in файлы))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as фф:
              фф.write(f"metka={метка}\n")
          # те же файлы, что выложены, - для привязки к коммиту
          привязать = os.path.join(os.environ["RUNNER_TEMP"], "privyazat")
          os.makedirs(привязать, exist_ok=True)
          for ф in файлы:
              shutil.copy(ф, привязать)
      - name: Привязка файлов выпуска к коммиту
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/privyazat/*

  proverka:
    name: Проверка выпуска
    needs: vypusk
    uses: ./.github/workflows/proverka_vypuska.yml
    with:
      metka: ${{ needs.vypusk.outputs.metka }}
