# Библиотека llama.cpp для модуля «модели»: сборка закреплённой версии (versiya.LLAMA_CPP)
# только для процессора на четырёх системах (поставка/собрать_llama.py). Сборка долгая, поэтому
# готовый архив хранится в кэше по метке llama.cpp и тексту сценария сборки: новая сборка
# бывает только при смене версии или сценария. Архивы llama-<метка>-<система>.zip передаются
# дальше как файлы прогона (artifacts) llama-<система>.
# Вызывается из «Проверка» (proverka.yml) и «Выпуск» (vypusk.yml); можно запустить и кнопкой.
name: Библиотека llama.cpp

on:
  workflow_call:
  workflow_dispatch:

jobs:
  sborka:
    name: Сборка llama.cpp (${{ matrix.platforma }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - на старой Ubuntu: библиотека, собранная с glibc 22.04, работает и на новых системах
          - os: ubuntu-22.04
            platforma: linux-x64
          - os: ubuntu-22.04-arm
            platforma: linux-arm64
          - os: macos-latest
            platforma: macos-arm64
          - os: windows-latest
            platforma: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Версия llama.cpp
        id: versiya
        shell: bash
        run: echo "metka=$(python -c 'import versiya; print(versiya.LLAMA_CPP)')" >> "$GITHUB_OUTPUT"
      - name: Кэш готовой библиотеки
        id: kesh
        uses: actions/cache@v5
        with:
          path: llama-gotovo
          key: llama-${{ steps.versiya.outputs.metka }}-${{ matrix.platforma }}-${{ hashFiles('поставка/собрать_llama.py') }}
      - name: Сборка (если нет в кэше)
        if: steps.kesh.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python поставка/собрать_llama.py --в=llama-sborka
          mkdir -p llama-gotovo
          cp llama-sborka/llama-*.zip llama-gotovo/
      - name: Архив
        shell: bash
        run: |
          ls -l llama-gotovo
          for f in llama-gotovo/*.zip; do
            echo "$(basename "$f"): $(( $(wc -c < "$f") / 1024 )) КБ" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: llama-${{ matrix.platforma }}
          path: llama-gotovo/*.zip
          if-no-files-found: error
