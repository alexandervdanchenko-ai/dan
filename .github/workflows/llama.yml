# Библиотека llama.cpp для модуля «модели»: сборка закреплённой версии (modeli.ВЕРСИЯ_LLAMA)
# только для процессора на четырёх системах (поставка/собрать_llama.py). Сборка долгая, поэтому
# готовый архив хранится в кэше по метке llama.cpp и тексту сценария сборки: новая сборка
# бывает только при смене версии или сценария. Архивы llama-<метка>-<система>.zip передаются
# дальше как файлы прогона (artifacts) llama-<система>.
# Вызывается из «Проверка» (proverka.yml) и «Выпуск» (vypusk.yml); можно запустить и кнопкой.
name: Библиотека llama.cpp

on:
  workflow_call:
  workflow_dispatch:

jobs:
  sborka:
    name: Сборка llama.cpp (${{ matrix.platforma }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64 - на старой Ubuntu: библиотека, собранная с glibc 22.04, работает и на новых
          # системах. ARM - на 24.04 с gcc 14 (как в выпусках llama.cpp): gcc 11 из 22.04 не знает
          # наборов команд armv9.2 (SME), под которые собираются варианты для процессора
          - os: ubuntu-22.04
            platforma: linux-x64
            # пример llama.cpp llama-simple: с ним тесты модуля «модели» сверяют ответ Дана
            simple: true
          - os: ubuntu-24.04-arm
            platforma: linux-arm64
            gcc14: true
          - os: macos-latest
            platforma: macos-arm64
          - os: windows-latest
            platforma: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Версия llama.cpp
        id: versiya
        shell: bash
        run: echo "metka=$(python -c 'import modeli; print(modeli.ВЕРСИЯ_LLAMA)')" >> "$GITHUB_OUTPUT"
      - name: Кэш готовой библиотеки
        id: kesh
        uses: actions/cache@v5
        with:
          path: llama-gotovo
          key: llama-${{ steps.versiya.outputs.metka }}-${{ matrix.platforma }}-${{ hashFiles('поставка/собрать_llama.py') }}
      - name: gcc 14 (Linux ARM)
        if: steps.kesh.outputs.cache-hit != 'true' && matrix.gcc14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Сборка (если нет в кэше)
        if: steps.kesh.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python поставка/собрать_llama.py --в=llama-sborka ${{ matrix.simple && '--llama-simple' || '' }}
          mkdir -p llama-gotovo
          cp llama-sborka/llama-*.zip llama-gotovo/
          if ls llama-sborka/llama-simple-* >/dev/null 2>&1; then cp llama-sborka/llama-simple-* llama-gotovo/; fi
      - name: Архив
        shell: bash
        run: |
          ls -l llama-gotovo
          for f in llama-gotovo/*; do
            echo "$(basename "$f"): $(( $(wc -c < "$f") / 1024 )) КБ" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: llama-${{ matrix.platforma }}
          path: llama-gotovo/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.simple
        with:
          name: llama-simple-${{ matrix.platforma }}
          path: llama-gotovo/llama-simple-*
          if-no-files-found: error
