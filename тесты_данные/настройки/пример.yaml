# Настройки
название: Пример YAML
сервер:
  адрес: 127.0.0.1
  порт: 8080
  включён: true
  предел: 1.5e3
  пусто: null
  ничего:
  тильда: ~
пользователи:
  - имя: Иван
    роли: [админ, "редактор"]
  - имя: Пётр
    роли:
      - чтение
  - просто строка
  -
    вложенный: 1
список_на_том_же:
- а
- б
строки:
  одинарные: 'it''s'
  двойные: "строка\tс \"кавычками\" и \u0414"
  с_решёткой: "a # не комментарий"
  без_кавычек: просто текст # комментарий
  двоеточие: "a: b"
  url: http://example.com/путь
блок: |
  первая строка
    с отступом
  третья

свёрнутый: >-
  слова одного
  абзаца

  новый абзац
поток: {а: 1, б: [x, y], "в": "z"}
числа: [0x1F, 0o17, -5, +3, .5, 1., .inf, -.inf]
строки_похожие: [yes, no, on, 012abc, "123"]
